<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptVault — Version, Compare, Improve AI Prompts</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100vw';
        div.style.height = '100vh';
        div.style.backgroundColor = 'rgba(220,38,38,0.95)';
        div.style.color = 'white';
        div.style.padding = '30px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '13px';
        div.style.overflowY = 'auto';
        div.style.whiteSpace = 'pre-wrap';
        div.innerHTML = '<h2>Global Script Error</h2>' + e.message + '\n\n' + (e.error?.stack || 'No stack trace available.');
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100vw';
        div.style.height = '100vh';
        div.style.backgroundColor = 'rgba(217,119,6,0.95)';
        div.style.color = 'white';
        div.style.padding = '30px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '13px';
        div.style.overflowY = 'auto';
        div.style.whiteSpace = 'pre-wrap';
        div.innerHTML = '<h2>Unhandled Promise Rejection</h2>' + (e.reason?.message || String(e.reason)) + '\n\n' + (e.reason?.stack || 'No stack trace available.');
        document.body.appendChild(div);
      });
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
